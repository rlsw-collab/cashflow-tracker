name: Keep Streamlit Apps Alive

on:
  schedule:
    # 每日 UTC 00:00 (香港時間 08:00) 及 UTC 12:00 (香港時間 20:00) 執行
    - cron: '0 0,12 * * *'
  # 容許隨時在 GitHub 頁面手動點擊測試執行
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Open Streamlit Apps
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          urls = [
              'https://rlswexp.streamlit.app',
              'https://rkchtool.streamlit.app'
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              for url in urls:
                  print(f'Visiting {url}...')
                  page.goto(url, timeout=60000)
                  time.sleep(5)
                  # 如果偵測到休眠按鈕，自動點擊喚醒
                  btn = page.locator('button:has-text(\"Yes, get this app back up!\")')
                  if btn.count() > 0:
                      print('App is sleeping, clicking wake up button...')
                      btn.click()
                      time.sleep(20)
                  print(f'Successfully loaded {url}')
              browser.close()
          "
